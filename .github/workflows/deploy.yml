name: Deploy

# Reusable deploy core. Invoked by:
#   - deploy-dev.yml   (push to `dev`         -> environment: dev)
#   - deploy-prod.yml  (release published     -> environment: prod)
# and directly via the Actions tab for dev reruns or a production plan-only
# preview from a v* tag on main (workflow_dispatch). Production apply requires
# a published GitHub Release and the prod Environment approval.
on:
  workflow_call:
    inputs:
      environment:
        description: Environment to deploy (dev or prod)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  terraform-apply:
    name: Terraform deploy or plan (${{ inputs.environment }})
    if: >-
      (inputs.environment == 'dev' && github.ref == 'refs/heads/dev') ||
      (inputs.environment == 'prod' && startsWith(github.ref, 'refs/tags/v') &&
        (github.event_name == 'release' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    # Gates on the GitHub Environment: role ARN + region come from its
    # secret/variable, and prod's required-reviewer approval applies here.
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify production release ancestry
        if: ${{ inputs.environment == 'prod' }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'The production tag must point to a commit on main.' >&2
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "518892333858"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Install once at the repo root; workspaces (backend + frontend) share the
      # lockfile. Needed for both the Lambda bundles and the frontend build.
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      # Bundle the api + worker Lambdas into backend/dist/{api,worker} BEFORE
      # terraform plan — data.archive_file zips these dirs and its hash drives
      # Lambda redeploys, so the artifacts must exist before plan reads them.
      - name: Build Lambda bundles
        working-directory: ${{ github.workspace }}
        run: npm run build:lambdas -w @good-neighbor/backend

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Init
        run: terraform init

      - name: Verify existing production DNS state
        if: ${{ inputs.environment == 'prod' }}
        run: |
          set -euo pipefail
          zone_id="$(terraform output -raw goodneighbor_dns_zone_id)"
          if [[ "$zone_id" != 'Z013233314Z835D93KVOT' ]]; then
            echo "Production state does not own the delegated goodneighbor.sf.gov zone: $zone_id" >&2
            exit 1
          fi

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Protect existing DNS and DNSSEC resources
        if: ${{ inputs.environment == 'prod' }}
        run: |
          set -euo pipefail
          terraform show -json tfplan | jq -e '
            [ .resource_changes[]?
              | select(.mode == "managed")
              | select(.address | IN(
                  "aws_route53_zone.goodneighbor",
                  "aws_route53_hosted_zone_dnssec.goodneighbor",
                  "aws_route53_key_signing_key.goodneighbor",
                  "aws_kms_key.goodneighbor_dnssec",
                  "aws_kms_key.goodneighbor_dns_logs",
                  "aws_cloudwatch_log_group.goodneighbor_dns",
                  "aws_cloudwatch_log_resource_policy.goodneighbor_dns",
                  "aws_route53_query_log.goodneighbor",
                  "aws_route53_zone.gn",
                  "aws_route53_hosted_zone_dnssec.gn",
                  "aws_route53_key_signing_key.gn",
                  "aws_kms_key.gn_dnssec",
                  "aws_kms_key.gn_dns_logs",
                  "aws_cloudwatch_log_group.gn_dns",
                  "aws_cloudwatch_log_resource_policy.gn_dns",
                  "aws_route53_query_log.gn"
                ))
              | select(.change.actions != ["no-op"])
              | .address
            ] | length == 0
          '

      - name: Summarize production plan
        if: ${{ inputs.environment == 'prod' }}
        run: |
          set -euo pipefail
          {
            echo '## Production Terraform plan'
            echo 'AWS account: 518892333858 (DEV account; separate prod state and resources)'
            echo 'Canonical domain: goodneighbor.sf.gov'
            echo 'Protected delegated zone: Z013233314Z835D93KVOT'
            echo "Tagged commit: $GITHUB_SHA"
            echo '```text'
            terraform show -json tfplan | jq -r '
              .resource_changes[]?
              | select(.mode == "managed" and .change.actions != ["no-op"])
              | "\(.change.actions | join("+")) \(.address)"
            '
            echo '```'
            if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
              echo 'Plan only: no Terraform apply or web publish was run.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: ${{ inputs.environment == 'dev' || github.event_name == 'release' }}
        run: terraform apply -auto-approve tfplan

      - name: Stop after production plan preview
        if: ${{ inputs.environment == 'prod' && github.event_name == 'workflow_dispatch' }}
        run: echo 'Production plan preview complete; publish the release only after reviewing this plan.'

      # Read the invoke URL + publish targets from state for the frontend build
      # and CloudFront invalidation below.
      - name: Capture Terraform outputs
        if: ${{ inputs.environment == 'dev' || github.event_name == 'release' }}
        id: tf
        run: |
          set -euo pipefail
          terraform output -json > "$RUNNER_TEMP/good-neighbor-tf-outputs.json"
          jq -er '
            {
              api_url: .api_url.value,
              bucket: .frontend_bucket_name.value,
              dist_id: .cloudfront_distribution_id.value,
              admin_bucket: .admin_frontend_bucket_name.value,
              admin_dist_id: .admin_cloudfront_distribution_id.value,
              admin_cognito_client_id: .admin_cognito_client_id.value,
              cognito_managed_login_domain: .cognito_managed_login_domain.value,
              dynamo_table: .dynamodb_table_name.value
            }
            | to_entries[]
            | if (.value | type) == "string" and (.value | length) > 0
              then "\(.key)=\(.value)"
              else error("Missing Terraform output: " + .key)
              end
          ' "$RUNNER_TEMP/good-neighbor-tf-outputs.json" >> "$GITHUB_OUTPUT"

      - name: Seed dev site codes
        if: ${{ inputs.environment == 'dev' }}
        working-directory: ${{ github.workspace }}
        env:
          DYNAMO_TABLE: ${{ steps.tf.outputs.dynamo_table }}
        run: npm run seed:dev-site-codes -w @good-neighbor/backend

      # No VITE_API_BASE: the SPA and the API share one CloudFront distribution,
      # so the frontend defaults to a same-origin base ("") and makes relative
      # calls (/site-code, /v1/*). This resolves to whichever origin served the
      # page — the CloudFront URL or a custom alias like dev.goodneighborsf.org —
      # so it stays within connect-src 'self' instead of triggering a cross-origin
      # CSP violation. (api_url is still used for the /health smoke test below.)
      # No VITE_API_BASE: the SPA and the API share one CloudFront distribution,
      # so the frontend defaults to a same-origin base ("") and makes relative
      # calls (/site-code, /v1/*). This resolves to whichever origin served the
      # page — the CloudFront URL or a custom alias like dev.goodneighborsf.org —
      # so it stays within connect-src 'self' instead of triggering a cross-origin
      # CSP violation. (api_url is still used for the /health smoke test below.)
      # RELEASE stamps the build for the error tracker (error-report.js reads
      # __RELEASE__, defined in vite.config.js) and keys the sourcemap upload.
      - name: Build frontend
        if: ${{ inputs.environment == 'dev' || github.event_name == 'release' }}
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: npm run build -w @good-neighbor/frontend

      - name: Configure admin frontend
        if: ${{ inputs.environment == 'dev' || github.event_name == 'release' }}
        working-directory: ${{ github.workspace }}
        run: |
          cat > admin-frontend/config.js <<CONFIG
          window.GOOD_NEIGHBOR_ADMIN_CONFIG = {
            cognitoDomain: "${{ steps.tf.outputs.cognito_managed_login_domain }}",
            clientId: "${{ steps.tf.outputs.admin_cognito_client_id }}",
            redirectUri: location.origin + "/auth/callback",
            logoutUri: location.origin + "/",
            apiBase: "",
            localDebugAdmin: false,
          };
          CONFIG

      # Upload sourcemaps to the error tracker so client stack traces
      # symbolicate for contributors. The upload is per-release (the sha the
      # client sends) and needs POSTHOG_CLI_API_KEY (a personal API key —
      # per-env GH Environment secret) + POSTHOG_CLI_PROJECT_ID (per-env GH
      # Environment variable) — the CLI's headless-CI auth variables. The
      # pipeline is inject → upload: inject stamps the built chunks with
      # release/chunk metadata (required for the upload to be usable), upload
      # then associates the maps with the release named after the commit sha.
      # Best-effort: a failed upload must not fail the deploy (errors just
      # stay minified until the next green run), hence continue-on-error on
      # both steps + the CLI's --no-fail on the upload.
      - name: Inject PostHog metadata into bundles
        if: ${{ (inputs.environment == 'dev' || github.event_name == 'release') && vars.POSTHOG_SOURCEMAP_UPLOAD == 'true' }}
        working-directory: ${{ github.workspace }}
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          npx @posthog/cli sourcemap inject \
            --directory frontend/dist
        continue-on-error: true

      - name: Upload sourcemaps to PostHog
        if: ${{ (inputs.environment == 'dev' || github.event_name == 'release') && vars.POSTHOG_SOURCEMAP_UPLOAD == 'true' }}
        working-directory: ${{ github.workspace }}
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          npx @posthog/cli sourcemap upload \
            --directory frontend/dist \
            --release-name good-neighbor \
            --release-version "$RELEASE_SHA" \
            --host https://us.i.posthog.com \
            --no-fail
        continue-on-error: true

      # Maps must not go public — they'd leak full source. They live in
      # PostHog (uploaded above) and only there.
      - name: Publish frontend to S3
        if: ${{ inputs.environment == 'dev' || github.event_name == 'release' }}
        working-directory: ${{ github.workspace }}
        run: aws s3 sync frontend/dist "s3://${{ steps.tf.outputs.bucket }}" --delete --exclude "*.map"

      - name: Publish admin frontend to S3
        if: ${{ inputs.environment == 'dev' || github.event_name == 'release' }}
        working-directory: ${{ github.workspace }}
        run: |
          aws s3 sync admin-frontend "s3://${{ steps.tf.outputs.admin_bucket }}" \
            --delete \
            --exclude "README.md" \
            --exclude "config.example.js"

      # Env-scoped: only this environment's distribution is invalidated.
      - name: Invalidate CloudFront
        if: ${{ inputs.environment == 'dev' || github.event_name == 'release' }}
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.tf.outputs.dist_id }}" --paths "/*"

      - name: Invalidate admin CloudFront
        if: ${{ inputs.environment == 'dev' || github.event_name == 'release' }}
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.tf.outputs.admin_dist_id }}" --paths "/*"

      - name: Smoke test /health
        if: ${{ inputs.environment == 'dev' || github.event_name == 'release' }}
        run: curl -fsS "${{ steps.tf.outputs.api_url }}/health"

      # API-response-integrity tripwire (plan §4): the API's JSON error
      # responses must reach the viewer un-rewritten through the CloudFront
      # edge (api_url IS the distribution domain — outputs.tf). If this ever
      # returns HTML (e.g. a distribution-wide SPA error page again), the
      # frontend's non-JSON guard degrades to silent breakage — fail the
      # deploy here. No -f: the expected response IS an error (401), and -f
      # would exit 22 before we can assert the content type. Bounded retries
      # absorb the seconds of error-page/behavior propagation after the
      # invalidation above.
      - name: Smoke test API error shape
        if: ${{ inputs.environment == 'dev' || github.event_name == 'release' }}
        run: |
          set -euo pipefail
          url="${{ steps.tf.outputs.api_url }}/v1/checks/00000000-0000-0000-0000-000000000000"
          content_type=""
          for _ in 1 2 3 4 5; do
            content_type="$(
              curl -sS -o /dev/null -w '%{content_type}' "$url"
            )"
            case "$content_type" in
              application/json*) exit 0 ;; # authorizer 401 JSON — expected
              *) sleep 10 ;;               # propagation — retry
            esac
          done
          echo "API error responses must be JSON, got: $content_type" >&2
          exit 1

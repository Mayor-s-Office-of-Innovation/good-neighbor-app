repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.3
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        name: Terraform validate (app environments)
        # Module changes still trigger this hook. Validate through the roots
        # that supply provider aliases, not each changed file's directory.
        files: ^infra/(environments|modules)/.*\.(tf(vars)?|terraform\.lock\.hcl)$
        pass_filenames: false
        args:
          - --tf-init-args=-input=false
          - --tf-init-args=-lockfile=readonly
          - infra/environments/dev/main.tf
          - infra/environments/prod/main.tf
      - id: terraform_validate
        name: Terraform validate (state bootstrap)
        # Bootstrap pins its own Terraform version; run it only for its edits.
        files: ^infra/bootstrap/.*\.(tf(vars)?|terraform\.lock\.hcl)$
        args:
          - --tf-init-args=-input=false
          - --tf-init-args=-lockfile=readonly
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.252
    hooks:
      - id: checkov
        args:
          - --quiet
          - --framework
          - terraform
          # Keep aligned with the Checkov exclusions in .github/workflows/ci.yml.
          - --skip-check
          - CKV2_AWS_62,CKV_AWS_144,CKV2_AWS_31

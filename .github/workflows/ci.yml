name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate guidance policy
        run: npm run policy:validate --workspace backend

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ubuntu-latest ships a JRE (needed by the DynamoDB Local / ElasticMQ jars
      # the harness launches). Chromium only — the suite targets one engine.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The harness self-downloads ~250 MB of emulator binaries (MinIO
      # ~103 MB, ElasticMQ jar, DynamoDB Local) into backend/.local/ on first
      # run. Cache across runs — especially the MinIO binary, which is fetched
      # from a pinned GitHub release asset (dl.min.io went 410 in 2026).
      - name: Cache local harness binaries
        uses: actions/cache@v4
        with:
          path: backend/.local
          key: local-harness-${{ runner.os }}-${{ hashFiles('backend/scripts/local-minio.mjs', 'backend/scripts/local-mq.mjs') }}

      - name: Copy env example
        run: cp .env.example .env.local

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Security scans
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source /repo --redact --verbose

      - name: CodeQL init
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4
        continue-on-error: true

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Format
        run: terraform fmt -recursive -check ../..

      - name: Init without backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
        with:
          directory: infra
          framework: terraform
          quiet: true
          skip_check: CKV2_AWS_62,CKV_AWS_144,CKV2_AWS_31

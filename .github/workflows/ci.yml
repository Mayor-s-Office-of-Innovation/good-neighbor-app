name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate guidance policy
        run: npm run policy:validate --workspace backend

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ubuntu-latest ships a JRE (needed by the DynamoDB Local / ElasticMQ jars
      # the harness launches). Chromium only — the suite targets one engine.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The harness self-downloads ~250 MB of emulator binaries (MinIO
      # ~103 MB, ElasticMQ jar, DynamoDB Local) into backend/.local/ on first
      # run. Cache across runs — especially the MinIO binary, which is fetched
      # from a pinned GitHub release asset (dl.min.io went 410 in 2026).
      - name: Cache local harness binaries
        uses: actions/cache@v6
        with:
          path: backend/.local
          key: local-harness-${{ runner.os }}-${{ hashFiles('backend/scripts/local-minio.mjs', 'backend/scripts/local-mq.mjs') }}

      - name: Copy env example
        run: cp .env.example .env.local

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  perf:
    name: Performance budgets
    # Runs for Dependabot PRs too (unlike `security`): dependency bumps are the
    # size-budget's primary target. size-limit is the hard gate — raising a
    # limit is a deliberate, reviewable package.json edit. lhci runs warn-only
    # (see frontend/lighthouserc.json) until its noise floor is measured;
    # promotion to hard gate is a separate change.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend

      - name: Bundle size budget
        run: npx size-limit
        working-directory: frontend

      - name: Lighthouse (lab metrics, warn-only)
        run: npx lhci autorun
        working-directory: frontend

      # LHCI's assert output only prints rows for warn/fail assertions, so a
      # clean run logs nothing. This script prints a per-run metrics table into
      # the step log AND the run's Summary tab. Reads .lighthouseci/ (which the
      # step above leaves relative to THIS working-directory: frontend).
      - name: Print Lighthouse results
        run: node scripts/print-lighthouse.mjs
        working-directory: frontend

      # Full HTML/JSON Lighthouse reports. NOTE: .lighthouseci is a dot-dir and
      # upload-artifact@v7 excludes hidden files by default — hence
      # include-hidden-files: true (its absence is what produced
      # "No files were found" on the first runs, twice).
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  security:
    name: Security scans
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source /repo --redact --verbose

      - name: CodeQL init
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4
        continue-on-error: true

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Format
        run: terraform fmt -recursive -check ../..

      - name: Init without backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
        with:
          directory: infra
          framework: terraform
          quiet: true
          skip_check: CKV2_AWS_62,CKV_AWS_144,CKV2_AWS_31

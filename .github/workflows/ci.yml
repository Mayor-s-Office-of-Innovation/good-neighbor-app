name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Rewrite git protocol for npm git deps
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install
        run: npm ci

      - name: Verify immutable action references
        run: |
          node --test scripts/check-action-pins.test.mjs
          node scripts/check-action-pins.mjs

      - name: Reject literal AWS account identifiers
        run: |
          node --test scripts/check-aws-account-identifiers.test.mjs
          node scripts/check-aws-account-identifiers.mjs

      - name: Format
        run: npm run format:check

      - name: Test alarm delivery preflight guards
        run: node --test scripts/test-alarm-delivery.test.mjs

      - name: Lint
        run: npm run lint

      - name: Test frontend asset publication
        run: node --test scripts/publish-web-assets.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Check support knowledge provenance
        run: npm run support:check --workspace backend

      - name: Validate guidance policy
        run: npm run policy:validate --workspace backend

      - name: Validate translation catalogs
        run: npm run i18n:check --workspace frontend

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    container:
      # Keep the image version aligned with @playwright/test in e2e/package.json.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Rewrite git protocol for npm git deps
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install
        run: npm ci

      - name: Test support dialog accessibility
        run: npm run test:support:ui

      - name: Test upload reservation persistence in browser IndexedDB
        run: node --test e2e/upload-reservation-storage.test.mjs

      - name: Test issue update recovery in Chromium and WebKit
        run: npm run test:updates:ui

      - name: Test error states and connectivity in Chromium and WebKit
        run: npm run test:errors:ui

      # The offline-launch service worker exists only in a build, so this runs
      # against `vite preview` (npm run dev:offline), not the dev server.
      - name: Test offline launch
        run: npm run test:offline:e2e

      # Browsers and their OS dependencies are in the image. The host runner's
      # Java installation is not available inside the job container.
      - name: Setup Java for local harness
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # The harness self-downloads ~250 MB of emulator binaries (MinIO
      # ~103 MB, ElasticMQ jar, DynamoDB Local) into backend/.local/ on first
      # run. Cache across runs — especially the MinIO binary, which is fetched
      # from a pinned GitHub release asset (dl.min.io went 410 in 2026).
      - name: Cache local harness binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.local
          key: local-harness-${{ runner.os }}-${{ hashFiles('backend/scripts/local-minio.mjs', 'backend/scripts/local-mq.mjs') }}

      - name: Copy env example
        run: cp .env.example .env.local

      - name: Run e2e tests
        run: npm run test:e2e

      # Always, not only on failure: the HTML report holds ramp-check's
      # highlight screenshots for AAA findings, which warn without failing
      # the suite and are what the design review works from.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  perf:
    name: Performance budgets
    # Runs for Dependabot PRs too (unlike `security`): dependency bumps are the
    # size-budget's primary target. size-limit is the hard gate — raising a
    # limit is a deliberate, reviewable package.json edit. Lighthouse runs
    # warn-only (see frontend/speed-check.config.js) until its noise floor is
    # measured; promotion to hard gate is a separate change.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Rewrite git protocol for npm git deps
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend

      - name: Bundle size budget
        run: npx size-limit
        working-directory: frontend

      - name: Lighthouse via speed-check (lab metrics, warn-only)
        # speed-check (github:Mayor-s-Office-of-Innovation/speed-check, pinned
        # by commit in frontend/package.json) serves dist/ via `vite preview`,
        # runs Lighthouse 3x against /, evaluates the warn-only budgets in
        # speed-check.config.js (median across runs), and prints the table
        # into the step log AND the run's Summary tab. Reports land in
        # frontend/speed-check-report/ (not a dot-dir, so no hidden-files flag).
        run: npm run perf
        working-directory: frontend

      # Lighthouse JSON results (drag into the Lighthouse Viewer) plus the
      # summary table and JSON.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: frontend/speed-check-report/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Security scans
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

      - name: CodeQL init
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Format
        run: terraform fmt -recursive -check ../..

      - name: Test dev state migration guards
        working-directory: ${{ github.workspace }}
        run: node --test infra/scripts/*.test.mjs

      - name: Init without backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Initialize production tests without backend
        working-directory: infra/environments/prod
        run: terraform init -backend=false

      - name: Test production Terraform inputs
        working-directory: infra/environments/prod
        run: terraform test

      - name: Initialize production backend bootstrap without backend
        working-directory: infra/bootstrap/prod-state
        # Registry discovery can fail with a transient connection reset.
        run: |
          for attempt in 1 2 3; do
            if terraform init -backend=false; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            echo "Terraform initialization failed; retrying in 10 seconds (attempt $attempt/3)."
            sleep 10
          done

      - name: Validate production backend bootstrap
        working-directory: infra/bootstrap/prod-state
        run: terraform validate

      - name: Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
        with:
          directory: infra
          framework: terraform
          quiet: true
          skip_check: CKV2_AWS_62,CKV_AWS_144,CKV2_AWS_31

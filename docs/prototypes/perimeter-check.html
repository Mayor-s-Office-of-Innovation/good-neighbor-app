<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GNP — Perimeter check prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  <style>
    /* Pretine 7 / Mantine tokens (from the GNP Figma) */
    :root {
      --blue:#228be6; --g0:#f8f9fa; --g1:#f1f3f5; --g2:#e9ecef; --g3:#dee2e6; --g5:#adb5bd; --g6:#868e96; --g9:#212529;
      --ground:var(--g1); --sheet:#ffffff; --ink:var(--g9); --muted:var(--g6); --faint:var(--g5); --line:var(--g3);
      --sans:'Roboto',system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    }
    @media (prefers-color-scheme: dark){ :root{ --blue:#4dabf7; --g0:#25262b; --g1:#2c2e33; --g2:#373a40; --g3:#373a40; --g5:#5c5f66; --g6:#909296; --g9:#e9ecef; --ground:#1a1b1e; --sheet:#25262b; --ink:#e9ecef; --muted:#909296; --faint:#5c5f66; --line:#373a40; } }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; }
    body { margin:0; background:var(--ground); font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased; display:grid; place-items:center; padding:18px; }

    .device { width:min(460px, 100%); height:min(880px, calc(100vh - 36px)); background:var(--sheet); border:1px solid var(--line); border-radius:28px; overflow:hidden; position:relative; box-shadow:0 24px 60px -28px rgba(0,0,0,0.35); }
    .scr { position:absolute; inset:0; display:none; flex-direction:column; padding:26px 24px 24px; }
    .scr.active { display:flex; }

    /* atoms */
    .hd { display:flex; align-items:center; justify-content:space-between; flex:none; }
    .hl { display:flex; align-items:center; gap:11px; }
    .ava { width:38px; height:38px; border-radius:50%; background:var(--g2); flex:none; }
    .hn { font-size:15px; font-weight:600; line-height:1.15; display:block; }
    .hs { font-size:12px; color:var(--faint); display:block; margin-top:1px; }
    .lbl { font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--faint); font-weight:600; }
    .icon { width:22px; height:22px; flex:none; }
    button { font-family:var(--sans); border:0; background:none; cursor:pointer; color:inherit; padding:0; }

    /* HOME — L4 editorial */
    .ed-top { margin-top:26px; }
    .summary { font-size:29px; font-weight:700; letter-spacing:-0.02em; line-height:1.2; margin:10px 0 0; }
    .byline { font-size:13px; color:var(--faint); margin:12px 0 0; }
    .space { flex:1; }
    .recfoot { display:flex; align-items:center; justify-content:space-between; padding-bottom:16px; }
    .recfoot .n { font-size:13px; color:var(--muted); }
    .bars-mini { display:flex; gap:3px; align-items:flex-end; height:22px; width:130px; }
    .bar { flex:1; background:var(--ink); border-radius:2.5px 2.5px 1px 1px; }
    .bar.p { background:var(--g3); }
    .bar.t { background:transparent; border:1.5px dashed var(--blue); height:100%; display:flex; align-items:flex-end; padding:1.5px; border-radius:3px; }
    .bar.t .f { width:100%; background:var(--blue); border-radius:1px; transition:height .4s ease; }
    .pill { width:100%; border-radius:999px; padding:17px; display:flex; align-items:center; justify-content:center; gap:11px; font-size:17px; font-weight:500; transition:transform .12s ease; }
    .pill:active { transform:scale(0.97); }
    .pill.pri { background:var(--ink); color:var(--sheet); }
    .pill.sec { background:var(--g1); color:var(--ink); margin-top:10px; }
    .resume { border:1px solid var(--line); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
    .resume .rt { font-size:14px; }
    .resume .rt b { font-weight:600; }
    .startover { font-size:13px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; align-self:center; padding-top:2px; }

    /* CAPTURE */
    .cap-top { display:flex; align-items:center; justify-content:space-between; flex:none; }
    .side-lbl { font-size:18px; font-weight:700; letter-spacing:-0.01em; }
    .ghost { color:var(--muted); font-size:14px; min-width:70px; }
    .ghost.r { text-align:right; }
    .stepper { display:flex; gap:6px; margin-top:14px; flex:none; }
    .seg { flex:1; height:8px; border-radius:99px; background:var(--g1); transition:background .25s ease; }
    .seg.current { background:var(--g1); box-shadow:inset 0 0 0 2px var(--ink); }
    .seg.covered { background:var(--ink); }
    .seg.skipped { background:repeating-linear-gradient(90deg,var(--g3) 0 4px,transparent 4px 8px); }
    .cam { flex:1; min-height:0; margin-top:14px; border-radius:16px; display:grid; place-items:center; background:repeating-linear-gradient(135deg, var(--g2) 0 12px, color-mix(in srgb, var(--g2) 88%, #000) 12px 24px); }
    .cam span { font-size:13px; color:var(--muted); }
    .strip { display:flex; gap:8px; flex-wrap:wrap; padding-top:12px; min-height:0; flex:none; }
    .strip:empty { display:none; }
    .ph { width:52px; height:52px; border-radius:10px; border:1px solid var(--line); position:relative; display:grid; place-items:center; background:repeating-linear-gradient(135deg,var(--g1) 0 6px,color-mix(in srgb,var(--g1) 90%,#000) 6px 12px); transform:scale(0.5); opacity:0; transition:transform .22s cubic-bezier(.2,1.4,.4,1), opacity .18s ease; cursor:pointer; }
    .ph.in { transform:scale(1); opacity:1; }
    .ph.out { transform:scale(0); opacity:0; }
    .ph svg { width:18px; height:18px; color:var(--muted); }
    .ph .x { position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; background:var(--ink); color:var(--sheet); font-size:12px; line-height:1; display:grid; place-items:center; }
    .cap-bar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding-top:16px; flex:none; }
    .shutter { width:70px; height:70px; border-radius:50%; justify-self:center; display:grid; place-items:center; transition:transform .1s ease; }
    .shutter:active { transform:scale(0.9); }
    .shutter .ring { width:70px; height:70px; border-radius:50%; border:4px solid var(--ink); display:grid; place-items:center; }
    .shutter .ring::after { content:''; width:54px; height:54px; border-radius:50%; background:var(--ink); }
    .nextbtn { justify-self:end; font-size:16px; font-weight:600; display:flex; align-items:center; gap:3px; opacity:0; pointer-events:none; transition:opacity .25s ease; }
    .nextbtn.show { opacity:1; pointer-events:auto; }

    /* REVIEW */
    .rv-lbl { margin-top:24px; }
    .tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .q { font-size:15px; padding:10px 15px; border:1px solid var(--line); border-radius:99px; color:var(--muted); background:var(--sheet); transition:background .15s, color .15s, border-color .15s, transform .1s; }
    .q:active { transform:scale(0.96); }
    .q.sel { background:var(--ink); color:var(--sheet); border-color:var(--ink); }
    .notes { width:100%; min-height:64px; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-family:var(--sans); font-size:16px; color:var(--ink); background:var(--sheet); resize:none; margin-top:16px; }
    .notes::placeholder { color:var(--faint); }
    .notes:focus { outline:2px solid var(--ink); border-color:transparent; }

    /* SYNTH overlay */
    .synth { position:absolute; inset:0; background:color-mix(in srgb, var(--sheet) 96%, transparent); display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:5; }
    .synth.on { display:flex; }
    .dots { display:inline-flex; gap:5px; }
    .dots i { width:7px; height:7px; border-radius:50%; background:var(--faint); animation:blink 1.1s infinite; }
    .dots i:nth-child(2){ animation-delay:.18s; } .dots i:nth-child(3){ animation-delay:.36s; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    @media (prefers-reduced-motion: reduce){ .dots i { animation:none; } .ph { transition:none; } }
    .synth .t { font-size:16px; color:var(--muted); }

    .toast { position:absolute; left:18px; right:18px; bottom:18px; background:var(--ink); color:var(--sheet); font-size:13px; padding:12px 15px; border-radius:12px; opacity:0; transform:translateY(8px); transition:opacity .25s, transform .25s; pointer-events:none; z-index:6; }
    .toast.show { opacity:1; transform:none; }
  </style>
</head>
<body>
  <div class="device">

    <!-- HOME -->
    <section class="scr active" data-s="home">
      <div class="hd">
        <div class="hl"><span class="ava"></span><div><span class="hn">Provider Name</span><span class="hs">Account ›</span></div></div>
      </div>
      <div class="ed-top">
        <span class="lbl" id="logStamp">Last log · —</span>
        <p class="summary" id="logSummary">No check yet</p>
        <p class="byline" id="logByline">Start a perimeter check.</p>
      </div>
      <div class="space"></div>
      <div class="resume" id="resumeCard" style="display:none;">
        <span class="rt">Check in progress — <b id="resumeAt">Side 2 of 4</b></span>
        <button class="pill pri" id="resumeBtn">Resume check</button>
        <button class="startover" id="startOverBtn">Start a new check instead</button>
      </div>
      <div class="recfoot">
        <span class="n"><b id="recDays">14</b> days on record</span>
        <div class="bars-mini" id="miniBars"></div>
      </div>
      <button class="pill pri" id="startBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.6l1.2-1.8A1.5 1.5 0 0 1 9.55 3.5h4.9c.5 0 .97.25 1.25.7L16.9 6h1.6A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-8Z"/><circle cx="12" cy="12.5" r="3.4"/></svg>
        Start check
      </button>
      <button class="pill sec" id="issueBtn">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4.5"/><path d="M5 4.5c4.2-2.4 7.8 2.2 12 0v9c-4.2 2.2-7.8-2.4-12 0"/></svg>
        Report a street issue
      </button>
    </section>

    <!-- CAPTURE -->
    <section class="scr" data-s="capture">
      <div class="cap-top">
        <button class="ghost" id="cancelBtn">‹ Cancel</button>
        <span class="side-lbl" id="sideLbl">Side 1 of 4</span>
        <button class="ghost r" id="skipBtn">Skip side</button>
      </div>
      <div class="stepper" id="stepper"></div>
      <div class="cam"><span>Camera view</span></div>
      <div class="strip" id="strip"></div>
      <div class="cap-bar">
        <span></span>
        <button class="shutter" id="shutter" aria-label="Take photo"><span class="ring"></span></button>
        <button class="nextbtn" id="nextBtn"><span id="nextTxt">Next side</span> ›</button>
      </div>
    </section>

    <!-- REVIEW -->
    <section class="scr" data-s="review">
      <div class="hd"><span class="lbl" id="rvTime"></span><span class="lbl">Provider Name</span></div>
      <span class="lbl rv-lbl">What did you see?</span>
      <div class="tags" id="tags"></div>
      <textarea class="notes" id="notes" placeholder="Add notes for the record"></textarea>
      <div class="space"></div>
      <button class="pill pri" id="submitBtn">Submit check</button>
    </section>

    <!-- SYNTH overlay + toast -->
    <div class="synth" id="synth"><span class="lbl">✦ Photo summary</span><div><span class="dots"><i></i><i></i><i></i></span></div><span class="t">Summarising…</span></div>
    <div class="toast" id="toast"></div>
  </div>

  <script>
    (function () {
      var N = 4;
      var TAGS = ['Street looks clear','Trash on the street','Graffiti','Poop on the ground','Bulky items dumped','Tents','Drug use on the street','Sidewalk blocked by someone','Someone in distress'];
      var HIST = [3,3,1,3,3,2,3,3,3,3,3,3,3]; // 13 prior days; today is the 14th bar
      var HPCT = {0:0.12,1:0.4,2:0.7,3:1};
      var sides, current, inProgress = false, picked = [], checksToday = 0;
      var lastLog = null; // {stamp, summary, byline}

      function fresh(){ sides=[]; for(var i=0;i<N;i++) sides.push({photos:0, skipped:false}); current=0; picked=[]; }
      fresh();
      function covered(i){ return sides[i].photos>0; }
      function show(id){ document.querySelectorAll('[data-s]').forEach(function(s){ s.classList.toggle('active', s.dataset.s===id); }); }
      function now(){ var d=new Date(),h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+(m<10?'0':'')+m+ap; }

      var toastT;
      function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },2400); }

      /* ---------- HOME ---------- */
      function renderHome(){
        document.getElementById('resumeCard').style.display = inProgress?'flex':'none';
        document.getElementById('startBtn').style.display = inProgress?'none':'flex';
        if(inProgress) document.getElementById('resumeAt').textContent = 'Side '+(current+1)+' of '+N;
        var st=document.getElementById('logStamp'), su=document.getElementById('logSummary'), by=document.getElementById('logByline');
        if(!lastLog){ st.textContent='Last log · —'; su.textContent='No check yet'; by.textContent='Start a perimeter check.'; }
        else { st.textContent=lastLog.stamp; su.textContent=lastLog.summary; by.textContent=lastLog.byline; }
        renderBars();
      }
      function renderBars(){
        var el=document.getElementById('miniBars'); el.innerHTML='';
        HIST.forEach(function(v){ var b=document.createElement('div'); b.className='bar'+(v<3?' p':''); b.style.height=(HPCT[v]*100)+'%'; el.appendChild(b); });
        var t=document.createElement('div'); t.className='bar t';
        var f=document.createElement('div'); f.className='f'; f.style.height=(Math.min(checksToday,3)/3*100)+'%';
        t.appendChild(f); el.appendChild(t);
      }

      /* ---------- CAPTURE ---------- */
      function renderCapture(){
        var step=document.getElementById('stepper'); step.innerHTML='';
        for(var i=0;i<N;i++){ var d=document.createElement('div'); d.className='seg';
          if(sides[i].skipped) d.classList.add('skipped');
          else if(covered(i)) d.classList.add('covered');
          else if(i===current) d.classList.add('current');
          step.appendChild(d); }
        document.getElementById('sideLbl').textContent='Side '+(current+1)+' of '+N;
        var next=document.getElementById('nextBtn');
        next.classList.toggle('show', covered(current));
        document.getElementById('nextTxt').textContent=(current===N-1)?'Next':'Next side';
      }
      function addPhoto(){
        sides[current].photos++;
        var ph=document.createElement('button'); ph.className='ph'; ph.setAttribute('aria-label','Delete photo');
        ph.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 15l-4.5-4.5L7 20"/></svg><span class="x">×</span>';
        ph.addEventListener('click', function(){
          ph.classList.add('out');
          setTimeout(function(){ ph.remove(); sides[current].photos--; renderCapture(); },200);
        });
        document.getElementById('strip').appendChild(ph);
        requestAnimationFrame(function(){ requestAnimationFrame(function(){ ph.classList.add('in'); }); });
        renderCapture();
      }
      function clearStrip(){ document.getElementById('strip').innerHTML=''; }
      function advance(){ if(current<N-1){ current++; clearStrip(); renderCapture(); } else openReview(); }

      /* ---------- REVIEW ---------- */
      function openReview(){
        document.getElementById('rvTime').textContent=now();
        document.getElementById('notes').value='';
        var el=document.getElementById('tags'); el.innerHTML=''; picked=[];
        TAGS.forEach(function(t){
          var c=document.createElement('button'); c.className='q'; c.textContent=t;
          c.addEventListener('click', function(){
            var k=picked.indexOf(t);
            if(k>=0){ picked.splice(k,1); c.classList.remove('sel'); } else { picked.push(t); c.classList.add('sel'); }
          });
          el.appendChild(c);
        });
        show('review');
      }

      /* ---------- SUBMIT → AI summary as the last log ---------- */
      function submit(){
        var issues=picked.filter(function(t){ return t!=='Street looks clear'; });
        var summary = issues.length
          ? issues.slice(0,3).join(', ') + (issues.length>3?' +'+(issues.length-3):'') + '.'
          : 'Perimeter clear — no trash, graffiti, or obstructions.';
        lastLog = { stamp:'Last log · Today · '+now(), summary:summary, byline:'Logged just now' };
        checksToday=Math.min(checksToday+1,3);
        inProgress=false;
        var sy=document.getElementById('synth'); sy.classList.add('on');
        setTimeout(function(){ sy.classList.remove('on'); fresh(); clearStrip(); renderHome(); show('home'); },1800);
      }

      /* wiring */
      document.getElementById('startBtn').addEventListener('click', function(){ fresh(); clearStrip(); inProgress=true; renderCapture(); show('capture'); });
      document.getElementById('resumeBtn').addEventListener('click', function(){ renderCapture(); show('capture'); });
      document.getElementById('startOverBtn').addEventListener('click', function(){ fresh(); clearStrip(); renderCapture(); show('capture'); });
      document.getElementById('issueBtn').addEventListener('click', function(){ toast('Street issue — separate quick report. Out of scope for this prototype.'); });
      document.getElementById('shutter').addEventListener('click', addPhoto);
      document.getElementById('nextBtn').addEventListener('click', advance);
      document.getElementById('skipBtn').addEventListener('click', function(){ sides[current].skipped=true; sides[current].photos=0; clearStrip(); advance(); });
      document.getElementById('cancelBtn').addEventListener('click', function(){ renderHome(); show('home'); });
      document.getElementById('submitBtn').addEventListener('click', submit);
      renderHome();
    })();
  </script>
</body>
</html>

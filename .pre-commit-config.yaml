repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.3
    hooks:
      - id: terraform_fmt
  - repo: local
    hooks:
      - id: terraform_validate
        name: Terraform validate (root configurations)
        entry: bash infra/scripts/validate-terraform.sh
        language: system
        pass_filenames: false
        files: '^(infra/.*\.(tf|tfvars|hcl)|infra/scripts/validate-terraform\.sh|\.pre-commit-config\.yaml)$'
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.252
    hooks:
      - id: checkov
        args:
          - --quiet
          - --framework
          - terraform
          # Keep aligned with the Checkov exclusions in .github/workflows/ci.yml.
          - --skip-check
          - CKV2_AWS_62,CKV_AWS_144,CKV2_AWS_31

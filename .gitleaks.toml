[extend]
useDefault = true

[allowlist]
description = "Known non-secret fixture and Figma design identifiers"
regexTarget = "secret"
regexes = [
  '''abcdefghijklmnopqrstuvwxyz_123456''',
  # Public design-file identifier in category-icons/sources.json, not an API token.
  # Match only this value, including historical commits; keep scanning all files.
  '''^muHTWTeWZtAiTmHE1UMxJd$''',
]

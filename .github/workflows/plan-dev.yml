name: Plan dev

# Shows what a deploy of the chosen branch would change in dev, without changing
# it: deploy.yml plans and applies in one job, so nobody can read its plan first.
# Needs a `dev-plan` GitHub Environment with the secrets AWS_ACCOUNT_ID and
# AWS_PLAN_ROLE_ARN (the read-only role from infra/modules/app/plan-role.tf) and
# the variable AWS_REGION. The deploy role is deliberately not in it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # By branch, so a plan for one branch can't cancel another's.
  group: plan-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No id-token here: a package script could otherwise mint its own OIDC token
  # and assume the plan role, whatever step the credentials come in at.
  build:
    name: Build Lambda bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Rewrite git protocol for npm git deps
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci

      # data.archive_file hashes these folders, so the plan shows which Lambdas change.
      - name: Build Lambda bundles
        run: npm run build:lambdas -w @good-neighbor/backend

      # A tarball keeps file modes and symlinks, which the bundle hashes depend on.
      - name: Pack Lambda bundles
        run: tar -czf lambda-dist.tgz backend/dist

      - name: Upload Lambda bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-dist
          path: lambda-dist.tgz
          retention-days: 1
          if-no-files-found: error

  terraform-plan:
    name: Terraform plan (dev)
    needs: build
    runs-on: ubuntu-latest
    environment: dev-plan
    # Only this job can get a token, and it runs no npm code.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate plan configuration
        env:
          EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$EXPECTED_ACCOUNT_ID" ]; then
            echo "AWS_ACCOUNT_ID is not configured for this GitHub Environment" >&2
            exit 1
          fi

      - name: Download Lambda bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-dist
          path: ${{ github.workspace }}

      - name: Unpack Lambda bundles
        working-directory: ${{ github.workspace }}
        run: tar -xzf lambda-dist.tgz && rm lambda-dist.tgz

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Init
        run: terraform init -input=false

      # No lock: a held lock would fail a deploy that starts during this plan, and
      # the role can't write the lock table. S3 serves the state whole either way.
      # The log is public, and a plan's text holds env values, so stdout goes nowhere.
      - name: Plan
        run: terraform plan -input=false -lock=false -out=tfplan > /dev/null

      # This repo is public, so the summary names changed attributes but never their values.
      - name: Summarize plan
        run: |
          set -euo pipefail
          {
            echo '## Terraform plan (dev)'
            echo
            echo "Ref: \`$GITHUB_REF_NAME\`. Only actions, addresses and the names of changed attributes are shown, because this repo is public."
            echo
            echo '```text'
            terraform show -json tfplan | jq -r -f "$GITHUB_WORKSPACE/infra/scripts/plan-summary.jq"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: Provision goodneighbor.sf.gov DNS zone

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    # The prod Environment also restricts refs; branch-local workflow edits
    # must not be able to bypass that external enforcement boundary.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/environments/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Validate deployment configuration
        env:
          EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$EXPECTED_ACCOUNT_ID" ]; then
            echo "AWS_ACCOUNT_ID is not configured for the prod GitHub Environment" >&2
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Initialize production remote state
        env:
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ALIAS: ${{ vars.TF_STATE_KMS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET is not configured for PROD" >&2; exit 1; }
          test -n "$TF_LOCK_TABLE" || { echo "TF_LOCK_TABLE is not configured for PROD" >&2; exit 1; }
          test -n "$TF_STATE_KMS_KEY_ALIAS" || { echo "TF_STATE_KMS_KEY_ALIAS is not configured for PROD" >&2; exit 1; }
          state_kms_key_arn="$(aws kms describe-key \
            --key-id "$TF_STATE_KMS_KEY_ALIAS" \
            --query KeyMetadata.Arn \
            --output text)"
          test -n "$state_kms_key_arn"
          test "$state_kms_key_arn" != "None"
          terraform init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=app/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="kms_key_id=$state_kms_key_arn" \
            -backend-config="encrypt=true"
      - name: Plan the hosted zone and its DNS controls
        run: >-
          terraform plan
          -target=aws_route53_hosted_zone_dnssec.goodneighbor
          -target=aws_route53_query_log.goodneighbor
          -out=tfplan
      - name: Reject unrelated changes or unsafe replacements
        run: |
          set -euo pipefail
          terraform show -json tfplan | jq -e '
            [.resource_changes[]? | select(.mode == "managed")]
            | all(.address as $address
              | ([
                "aws_route53_zone.goodneighbor",
                "aws_kms_key.goodneighbor_dnssec",
                "aws_route53_key_signing_key.goodneighbor",
                "aws_route53_hosted_zone_dnssec.goodneighbor",
                "aws_kms_key.goodneighbor_dns_logs",
                "aws_cloudwatch_log_group.goodneighbor_dns",
                "aws_cloudwatch_log_resource_policy.goodneighbor_dns",
                "aws_route53_query_log.goodneighbor"
                ] | index($address) != null)
              and (
                .change.actions == ["create"]
                or .change.actions == ["no-op"]
                or (
                  $address == "aws_route53_hosted_zone_dnssec.goodneighbor"
                  and .change.actions == ["delete", "create"]
                )
              ))
          '
      - name: Apply saved DNS-only plan
        run: terraform apply -auto-approve tfplan
      - name: Report delegation name servers
        run: |
          set -euo pipefail
          {
            echo '## goodneighbor.sf.gov delegation'
            echo 'Ask DT to add an NS record for goodneighbor.sf.gov with all four servers below.'
            echo '```text'
            terraform output -json goodneighbor_dns_name_servers | jq -r '.[]'
            echo '```'
            echo 'DNSSEC DS record (coordinate publication with DT after delegation):'
            echo '```text'
            terraform output -raw goodneighbor_dnssec_ds_record
            echo
            echo '```'
            echo "Hosted zone ID: $(terraform output -raw goodneighbor_dns_zone_id)"
          } >> "$GITHUB_STEP_SUMMARY"

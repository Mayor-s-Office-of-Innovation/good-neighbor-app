version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: "dev"
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: "dev"
  - package-ecosystem: terraform
    directories:
      - /infra/environments/dev
      - /infra/environments/prod
      - /infra/modules/app
      - /infra/bootstrap/prod-state
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: "dev"
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types:
          - "version-update:semver-major"

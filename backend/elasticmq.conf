# ElasticMQ config for the local dev harness (loaded via -Dconfig.file).
# Bind to 127.0.0.1 (not 0.0.0.0) so macOS doesn't prompt to "accept incoming
# network connections" for the JVM. Defaults otherwise match the AWS SDK's
# expectations: accountId 000000000000, region "elasticmq", empty context-path.

include classpath("application.conf")

node-address {
  protocol   = http
  host       = "127.0.0.1"
  port       = 9324
  context-path = ""
}

rest-sqs {
  enabled       = true
  bind-port     = 9324
  bind-hostname = "127.0.0.1"
  # Reject payloads that a real SQS queue would reject, so local behavior matches prod.
  sqs-limits    = strict
}

aws {
  region     = "us-east-1"
  accountId  = "000000000000"
}

# The harness creates its queue at runtime (scripts/lib/ensure-infra.mjs), so no
# static queues are declared here.
